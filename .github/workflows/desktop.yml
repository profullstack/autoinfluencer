# Build the desktop app for Linux, macOS and Windows and attach it to the release.
name: desktop

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The publish workflow runs alongside this one: wait until the package version it needs is on npm.
      - name: Wait for the package on npm
        shell: bash
        run: |
          want=$(node -p "require('../package.json').version")
          for i in $(seq 1 40); do
            [ "$(npm view @profullstack/autoinfluencer@$want version 2>/dev/null)" = "$want" ] && exit 0
            sleep 15
          done
          echo "@profullstack/autoinfluencer@$want never appeared on npm" && exit 1
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(dist/*.AppImage dist/*.deb dist/*.dmg dist/*.exe)
          gh release upload "$TAG" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'release'
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.exe
          retention-days: 1
